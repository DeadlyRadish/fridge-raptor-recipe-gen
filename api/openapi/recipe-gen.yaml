openapi: 3.0.3
info:
  title: Fridge Raptor Recipe Gen API
  version: 1.0.0
servers:
  - url: http://{host}:{port}
    variables:
      host:
        default: localhost
      port:
        default: "8000"
paths:
  /health:
    get:
      summary: Service healthcheck
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
                  environment:
                    type: string
  /api/v1/recipes/generate:
    post:
      summary: Generate a recipe via GigaChat/Sber
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: ["products"]
              properties:
                user_id:
                  type: integer
                  nullable: true
                products:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: ["name", "quantity", "unit"]
                    properties:
                      name:
                        type: string
                      quantity:
                        type: number
                      unit:
                        type: string
                preferences:
                  type: object
                  nullable: true
                  additionalProperties:
                    oneOf:
                      - type: string
                      - type: number
                      - type: boolean
      responses:
        "201":
          description: Recipe generated and persisted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      user_id:
                        type: integer
                        nullable: true
                      title:
                        type: string
                      description:
                        type: string
                        nullable: true
                      ingredients:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            quantity:
                              type: number
                            unit:
                              type: string
                            note:
                              type: string
                              nullable: true
                      instructions:
                        type: array
                        items:
                          type: object
                          properties:
                            step:
                              type: integer
                            description:
                              type: string
                      cooking_time:
                        oneOf:
                          - type: integer
                          - type: string
                      difficulty:
                        type: string
                      preferences:
                        type: object
                        nullable: true
                      products_used:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            quantity:
                              type: number
                            unit:
                              type: string
                      created_at:
                        type: string
                        format: date-time
                      updated_at:
                        type: string
                        format: date-time
        "422":
          description: Validation error

